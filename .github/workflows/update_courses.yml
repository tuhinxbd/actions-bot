name: Sync Academic Data

on:
  schedule:
    # Runs at 00:00 every Sunday (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual trigger

jobs:
  update-courses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TARGET_REPO || 'tuhinxbd/bubt-server' }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ vars.TARGET_BRANCH || 'master' }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Academic Scraper
        run: python students/course/scripts/master_auto_get_courses.py

      - name: Update Index
        run: python .scripts/data_indexer.py || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "tuhinxbd"
          git config --global user.email "20234208032@eee.bubt.edu.bd"
          git add students/course/api/*.json api_index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Auto-update academic data [$(date +'%Y-%m-%d')]" && git push origin HEAD:${{ vars.TARGET_BRANCH || 'master' }})
