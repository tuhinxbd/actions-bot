name: Sync Routine Data

on:
  schedule:
    # Runs at 01:00 UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Allows manual trigger

jobs:
  update-exams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TARGET_REPO || 'tuhinxbd/bubt-server' }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ vars.TARGET_BRANCH || 'master' }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 pdfplumber
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install --with-deps chromium

      - name: Run Routine Automation
        run: python students/exam/master_automation.py

      - name: Update Index
        run: python .scripts/data_indexer.py || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/exam/ api_index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Auto-update routine data [$(date +'%Y-%m-%d')]" && git push origin HEAD:${{ vars.TARGET_BRANCH || 'master' }})
