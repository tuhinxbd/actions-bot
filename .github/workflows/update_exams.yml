name: Auto Update Exam Routines (Remote)

on:
  schedule:
    # Runs at 01:00 UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Allows manual trigger

jobs:
  update-exams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private BUBT Server Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TARGET_REPO || 'tuhinx/bubt-server' }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ vars.TARGET_BRANCH || 'master' }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install playwright requests beautifulsoup4 pdfplumber

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run Exam Master Automation
        run: python students/exam/master_automation.py

      - name: Update Global Data Index
        run: python .scripts/data_indexer.py || true

      - name: Commit and Push Changes to Private Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/exam/ api_index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Auto-update BUBT exam routines [$(date +'%Y-%m-%d')]" && git push origin HEAD:${{ vars.TARGET_BRANCH || 'master' }})
